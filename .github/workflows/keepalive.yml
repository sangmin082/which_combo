name: Server Keepalive

on:
  schedule:
    - cron: "*/10 * * * *" # 10분마다 서버를 깨워 Render 무료 티어 슬립 방지
  workflow_dispatch:

# 자기 자신을 re-enable하기 위한 권한 (60일 비활성화 타이머 리셋용)
permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 서버 핑
        run: |
          curl -sS -m 90 -o /dev/null -w "HTTP %{http_code}, %{time_total}s\n" \
            https://which-combo.onrender.com/ || true

      # GitHub는 저장소에 60일간 커밋이 없으면 스케줄 워크플로를 자동 비활성화한다.
      # 매 실행마다 자기 자신을 enable API로 갱신해 그 타이머를 리셋한다.
      - name: 워크플로 자동 비활성화 방지 (60일 타이머 리셋)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT \
            "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable"
